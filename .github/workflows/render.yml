name: RIWA render video
on:
  push:
    paths: ["jobs/**.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: riwa-render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            render
            music
            jobs
      - name: FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null; then
            mkdir -p "$HOME/ff" && cd "$HOME/ff"
            timeout 180 curl -sSL -o ff.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz \
              && tar xf ff.tar.xz --strip-components=1 \
              || (sudo DEBIAN_FRONTEND=noninteractive timeout 400 apt-get install -y -qq --no-install-recommends ffmpeg)
            if [ -x "$HOME/ff/ffmpeg" ]; then echo "$HOME/ff" >> "$GITHUB_PATH"; fi
          fi
      - name: Check FFmpeg
        run: ffmpeg -version | head -1 && ffprobe -version | head -1
      - name: Render pending jobs and upload videos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 render/run_jobs.py

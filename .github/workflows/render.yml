name: RIWA render video
on:
  push:
    paths: ["jobs/**.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: riwa-render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            render
            music
            jobs
      - name: FFmpeg
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg); ffmpeg -version | head -1
      - name: Render pending jobs and upload videos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 render/run_jobs.py
